<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SP Addons</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
    header { text-align: center; margin-bottom: 30px; }
    header h1 { color: #38bdf8; font-size: 2.5rem; }
    header p { color: #94a3b8; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
    .card { background: #1e293b; border-radius: 12px; overflow: hidden; border: 1px solid #334155; display: flex; flex-direction: column; }
    .card img { width: 100%; height: 160px; object-fit: cover; }
    .card-content { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }
    .card-title { font-size: 1.25rem; font-weight: bold; margin-bottom: 8px; color: #f1f5f9; }
    .card-desc { font-size: 0.9rem; color: #94a3b8; margin-bottom: 15px; flex-grow: 1; }
    .card-btn { display: block; text-align: center; background: #0284c7; color: white; text-decoration: none; padding: 10px; border-radius: 6px; font-weight: bold; }
    .card-btn:hover { background: #0369a1; }
  </style>
</head>
<body>

  <header>
    <h1>SP Addons</h1>
    <p>Baixe os melhores addons atualizados automaticamente!</p>
  </header>

  <div class="grid" id="addons-container">
    <p style="text-align: center; grid-column: 1/-1;">Carregando addons...</p>
  </div>

  <script>
    const SUPABASE_URL = 'https://dsezdcusbhitmzjipvgy.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Kodxv-JTmas50sItp-s3Gg_R8GMX5l_';

    async function fetchAddons() {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/addons?select=*`, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });
        const data = await response.json();
        const container = document.getElementById('addons-container');
        container.innerHTML = '';

        if (data.length === 0) {
          container.innerHTML = '<p style="text-align: center; grid-column: 1/-1;">Nenhum addon encontrado.</p>';
          return;
        }

        data.forEach(addon => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <img src="${addon.image_url || 'https://via.placeholder.com/400x200'}" alt="${addon.title}">
            <div class="card-content">
              <div class="card-title">${addon.title}</div>
              <div class="card-desc">${addon.description || 'Sem descrição.'}</div>
              <a href="${addon.download_url}" target="_blank" class="card-btn">Baixar Addon</a>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        console.error('Erro ao buscar addons:', err);
      }
    }

    fetchAddons();
  </script>
</body>
</html>
