<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SP Addons | Minecraft Bedrock</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0b0f17; color: #f3f4f6; padding: 16px; min-height: 100vh; }
    
    header { display: flex; align-items: center; justify-content: space-between; padding: 10px 0 20px; border-bottom: 1px solid #1e293b; margin-bottom: 15px; }
    .logo { font-size: 1.4rem; font-weight: 900; color: #ffffff; display: flex; align-items: center; gap: 8px; }
    .logo span { background: #10b981; color: #000; font-size: 0.7rem; padding: 3px 8px; border-radius: 6px; font-weight: 800; }

    .btn-publish-open { background: #10b981; color: #000; font-weight: 800; font-size: 0.8rem; padding: 8px 14px; border-radius: 8px; border: none; cursor: pointer; outline: none; }
    .btn-publish-open:active { transform: scale(0.95); }

    /* Categorias */
    .categories { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 15px; scrollbar-width: none; }
    .categories::-webkit-scrollbar { display: none; }
    .cat-btn { background: #1a2332; color: #9ca3af; border: 1px solid #2d3748; padding: 10px 18px; border-radius: 25px; font-weight: 700; font-size: 0.85rem; white-space: nowrap; cursor: pointer; outline: none; transition: transform 0.15s, background 0.2s; }
    .cat-btn:active { transform: scale(0.95); }
    .cat-btn.active { background: #064e3b; color: #34d399; border-color: #10b981; }

    /* Pesquisa */
    .search-box { width: 100%; margin-bottom: 15px; }
    .search-box input { width: 100%; padding: 14px 18px; background: #161e2e; border: 1px solid #2d3748; border-radius: 12px; color: #fff; font-size: 0.95rem; outline: none; }
    .search-box input:focus { border-color: #10b981; }

    .counter { font-size: 0.85rem; color: #6b7280; margin-bottom: 15px; font-weight: 600; }

    /* Lista com Animação */
    .addons-list { display: flex; flex-direction: column; gap: 14px; }
    .card { background: #131b2e; border: 1px solid #1f293d; border-radius: 14px; padding: 14px; display: flex; gap: 14px; align-items: center; animation: fadeInUp 0.3s ease forwards; }
    .card img { width: 85px; height: 85px; border-radius: 10px; object-fit: cover; background: #1a2332; flex-shrink: 0; }
    .card-info { flex: 1; min-width: 0; }
    .card-title { font-size: 1rem; font-weight: 800; color: #f9fafb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-author { font-size: 0.75rem; color: #9ca3af; margin-top: 2px; }
    .card-desc { font-size: 0.8rem; color: #6b7280; margin: 4px 0 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    
    .tags { display: flex; gap: 6px; margin-bottom: 8px; }
    .tag { background: #064e3b; color: #34d399; font-size: 0.65rem; font-weight: 800; padding: 3px 8px; border-radius: 5px; text-transform: uppercase; }

    .btn-download { display: inline-flex; align-items: center; gap: 6px; background: #10b981; color: #000; font-weight: 800; font-size: 0.85rem; padding: 7px 14px; border-radius: 8px; text-decoration: none; }

    /* Modal Form de Publicar */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 99; justify-content: center; align-items: center; padding: 15px; }
    .modal { background: #131b2e; border: 1px solid #2d3748; padding: 20px; border-radius: 14px; width: 100%; max-width: 450px; }
    .modal h2 { margin-bottom: 15px; font-size: 1.2rem; color: #fff; }
    .modal input, .modal select, .modal textarea { width: 100%; padding: 10px; margin-bottom: 10px; background: #161e2e; border: 1px solid #2d3748; border-radius: 8px; color: #fff; outline: none; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .btn-cancel { background: #334155; color: #fff; padding: 8px 14px; border-radius: 6px; border: none; cursor: pointer; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">SP Addons <span>BEDROCK</span></div>
    <button class="btn-publish-open" onclick="toggleModal(true)">+ Publicar</button>
  </header>

  <div class="categories">
    <button class="cat-btn active" onclick="setCategory('Todos', this)">Todos</button>
    <button class="cat-btn" onclick="setCategory('Add-ons Bedrock', this)">Add-ons Bedrock</button>
    <button class="cat-btn" onclick="setCategory('Texturas', this)">Texturas</button>
    <button class="cat-btn" onclick="setCategory('Mapas', this)">Mapas</button>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Buscar conteúdos..." onkeyup="filterAddons()">
  </div>

  <div class="counter" id="addonCount">Carregando conteúdos...</div>

  <div class="addons-list" id="addons-container"></div>

  <!-- Modal de Publicação -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2>Publicar Conteúdo</h2>
      <input type="text" id="pubTitle" placeholder="Título do Addon/Textura">
      <input type="text" id="pubAuthor" placeholder="Seu Nome / Autor">
      <select id="pubCategory">
        <option value="Add-ons Bedrock">Add-ons Bedrock</option>
        <option value="Texturas">Texturas</option>
        <option value="Mapas">Mapas</option>
      </select>
      <input type="url" id="pubImage" placeholder="URL da Imagem / Capa">
      <input type="url" id="pubDownload" placeholder="Link de Download (.mcaddon / .mcpack)">
      <textarea id="pubDesc" placeholder="Descrição do conteúdo..." rows="3"></textarea>
      
      <div class="modal-actions">
        <button class="btn-cancel" onclick="toggleModal(false)">Cancelar</button>
        <button class="btn-publish-open" onclick="publicarAddon()">Enviar</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://dsezdcusbhitmzjipvgy.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Kodxv-JTmas50sItp-s3Gg_R8GMX5l_';
    let allAddons = [];
    let currentCategory = 'Todos';

    async function fetchAddons() {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/addons?select=*`, {
          headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
        });
        allAddons = await response.json();
        filterAddons();
      } catch (err) {
        document.getElementById('addonCount').innerText = "Erro ao carregar conteúdos.";
      }
    }

    function setCategory(category, button) {
      currentCategory = category;
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');
      filterAddons();
    }

    function filterAddons() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allAddons.filter(item => {
        const matchesCategory = (currentCategory === 'Todos') || (item.category === currentCategory);
        const matchesSearch = item.title.toLowerCase().includes(query) || (item.description && item.description.toLowerCase().includes(query));
        return matchesCategory && matchesSearch;
      });
      renderAddons(filtered);
    }

    function renderAddons(addons) {
      const container = document.getElementById('addons-container');
      const countEl = document.getElementById('addonCount');
      container.innerHTML = '';
      countEl.innerText = `${addons.length} conteúdos em "${currentCategory}"`;

      if (addons.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#6b7280; padding:30px;">Nenhum conteúdo encontrado nesta categoria.</p>';
        return;
      }

      addons.forEach(addon => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${addon.image_url || 'https://via.placeholder.com/100'}" alt="${addon.title}">
          <div class="card-info">
            <div class="card-title">${addon.title}</div>
            <div class="card-author">por ${addon.author || 'Comunidade'}</div>
            <div class="card-desc">${addon.description || 'Sem descrição.'}</div>
            <div class="tags">
              <span class="tag">${addon.category || 'Addon'}</span>
            </div>
            <a href="${addon.download_url}" class="btn-download" download>↓ Baixar</a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleModal(show) {
      document.getElementById('modalOverlay').style.display = show ? 'flex' : 'none';
    }

    async function publicarAddon() {
      const title = document.getElementById('pubTitle').value;
      const author = document.getElementById('pubAuthor').value || 'Usuário';
      const category = document.getElementById('pubCategory').value;
      const image_url = document.getElementById('pubImage').value;
      const download_url = document.getElementById('pubDownload').value;
      const description = document.getElementById('pubDesc').value;

      if (!title || !download_url) {
        alert("Preencha pelo menos o título e o link de download!");
        return;
      }

      const novo = { title, author, category, image_url, download_url, description, version: 'Bedrock' };

      const res = await fetch(`${SUPABASE_URL}/rest/v1/addons`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(novo)
      });

      if (res.ok) {
        alert("Conteúdo publicado com sucesso!");
        toggleModal(false);
        fetchAddons();
      } else {
        alert("Erro ao publicar. Tente novamente.");
      }
    }

    fetchAddons();
  </script>
</body>
</html>
