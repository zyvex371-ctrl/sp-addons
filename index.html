<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SP Addons | Minecraft Bedrock</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background-color: #0b0f17; color: #f3f4f6; padding: 16px; min-height: 100vh; }
    
    header { display: flex; align-items: center; justify-content: space-between; padding: 10px 0 20px; border-bottom: 1px solid #1e293b; margin-bottom: 15px; }
    .logo { font-size: 1.6rem; font-weight: 900; color: #ffffff; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }
    .logo span { background: #10b981; color: #000; font-size: 0.7rem; padding: 3px 8px; border-radius: 6px; font-weight: 800; text-transform: uppercase; }

    /* Categorias Ativas e Clicáveis */
    .categories { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 15px; scrollbar-width: none; }
    .categories::-webkit-scrollbar { display: none; }
    .cat-btn { background: #1a2332; color: #9ca3af; border: 1px solid #2d3748; padding: 10px 18px; border-radius: 25px; font-weight: 700; font-size: 0.85rem; white-space: nowrap; cursor: pointer; transition: all 0.25s ease; }
    .cat-btn:active { transform: scale(0.95); }
    .cat-btn.active { background: #064e3b; color: #34d399; border-color: #10b981; box-shadow: 0 0 12px rgba(16, 185, 129, 0.3); }

    /* Pesquisa */
    .search-box { width: 100%; margin-bottom: 15px; position: relative; }
    .search-box input { width: 100%; padding: 14px 18px; background: #161e2e; border: 1px solid #2d3748; border-radius: 12px; color: #fff; font-size: 0.95rem; outline: none; transition: border-color 0.3s; }
    .search-box input:focus { border-color: #10b981; box-shadow: 0 0 10px rgba(16, 185, 129, 0.2); }

    .counter { font-size: 0.85rem; color: #6b7280; margin-bottom: 15px; font-weight: 600; }

    /* Lista com Animação Smooth */
    .addons-list { display: flex; flex-direction: column; gap: 14px; }
    .card { background: #131b2e; border: 1px solid #1f293d; border-radius: 14px; padding: 14px; display: flex; gap: 14px; align-items: center; animation: fadeInUp 0.4s ease forwards; transition: transform 0.2s, border-color 0.2s; }
    .card:hover { border-color: #10b981; transform: translateY(-2px); }
    .card img { width: 90px; height: 90px; border-radius: 10px; object-fit: cover; background: #1a2332; flex-shrink: 0; }
    .card-info { flex: 1; min-width: 0; }
    .card-title { font-size: 1.05rem; font-weight: 800; color: #f9fafb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-author { font-size: 0.75rem; color: #9ca3af; margin-top: 2px; }
    .card-desc { font-size: 0.82rem; color: #6b7280; margin: 5px 0 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }
    
    .tags { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
    .tag { background: #064e3b; color: #34d399; font-size: 0.65rem; font-weight: 800; padding: 3px 8px; border-radius: 5px; text-transform: uppercase; }
    .tag.cat-tag { background: #1e293b; color: #38bdf8; }

    .btn-download { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: #10b981; color: #000; font-weight: 800; font-size: 0.85rem; padding: 8px 16px; border-radius: 8px; text-decoration: none; transition: background 0.2s, transform 0.1s; width: fit-content; }
    .btn-download:active { transform: scale(0.95); }
    .btn-download:hover { background: #059669; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">SP Addons <span>BEDROCK</span></div>
  </header>

  <!-- Categorias Clicáveis -->
  <div class="categories">
    <button class="cat-btn active" onclick="setCategory('Todos', this)">Todos</button>
    <button class="cat-btn" onclick="setCategory('Add-ons Bedrock', this)">Add-ons Bedrock</button>
    <button class="cat-btn" onclick="setCategory('Texturas', this)">Texturas</button>
    <button class="cat-btn" onclick="setCategory('Mapas', this)">Mapas</button>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Buscar Add-ons, Texturas e Mapas Bedrock..." onkeyup="filterAddons()">
  </div>

  <div class="counter" id="addonCount">Carregando conteúdos...</div>

  <div class="addons-list" id="addons-container"></div>

  <script>
    const SUPABASE_URL = 'https://dsezdcusbhitmzjipvgy.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Kodxv-JTmas50sItp-s3Gg_R8GMX5l_';
    let allAddons = [];
    let currentCategory = 'Todos';

    async function fetchAddons() {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/addons?select=*`, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });
        allAddons = await response.json();
        filterAddons();
      } catch (err) {
        document.getElementById('addonCount').innerText = "Erro ao carregar conteúdos.";
      }
    }

    function setCategory(category, button) {
      currentCategory = category;
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');
      filterAddons();
    }

    function filterAddons() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = allAddons.filter(item => {
        const matchesCategory = (currentCategory === 'Todos') || (item.category === currentCategory);
        const matchesSearch = item.title.toLowerCase().includes(query) || (item.description && item.description.toLowerCase().includes(query));
        return matchesCategory && matchesSearch;
      });

      renderAddons(filtered);
    }

    function renderAddons(addons) {
      const container = document.getElementById('addons-container');
      const countEl = document.getElementById('addonCount');
      container.innerHTML = '';
      countEl.innerText = `${addons.length} conteúdos encontrados em "${currentCategory}"`;

      if (addons.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#6b7280; padding:30px;">Nenhum conteúdo encontrado nesta categoria.</p>';
        return;
      }

      addons.forEach((addon, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.style.animationDelay = `${index * 0.05}s`;
        card.innerHTML = `
          <img src="${addon.image_url || 'https://via.placeholder.com/100'}" alt="${addon.title}">
          <div class="card-info">
            <div class="card-title">${addon.title}</div>
            <div class="card-author">por ${addon.author || 'Comunidade'}</div>
            <div class="card-desc">${addon.description || 'Sem descrição disponível.'}</div>
            <div class="tags">
              <span class="tag">BEDROCK</span>
              <span class="tag cat-tag">${addon.category || 'Addon'}</span>
            </div>
            <a href="${addon.download_url}" class="btn-download" download>↓ Baixar (.mcaddon / .mcpack)</a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    fetchAddons();
  </script>
</body>
</html>
