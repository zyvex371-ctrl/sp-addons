<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SP Addons | Bedrock</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: #0b0f17; color: #f3f4f6; padding: 15px; }
    
    header { display: flex; align-items: center; justify-content: space-between; padding: 10px 0 20px; }
    .logo { font-size: 1.5rem; font-weight: 800; color: #ffffff; display: flex; align-items: center; gap: 8px; }
    .logo span { background: #10b981; color: #000; font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
    
    .categories { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 15px; }
    .cat-btn { background: #1a2332; color: #9ca3af; border: 1px solid #2d3748; padding: 8px 16px; border-radius: 20px; font-weight: 600; font-size: 0.85rem; white-space: nowrap; }
    .cat-btn.active { background: #064e3b; color: #10b981; border-color: #10b981; }

    .search-box { width: 100%; margin-bottom: 20px; }
    .search-box input { width: 100%; padding: 12px 16px; background: #161e2e; border: 1px solid #2d3748; border-radius: 10px; color: #fff; font-size: 0.9rem; outline: none; }
    .search-box input:focus { border-color: #10b981; }

    .counter { font-size: 0.85rem; color: #6b7280; margin-bottom: 15px; }

    .addons-list { display: flex; flex-direction: column; gap: 12px; }
    .card { background: #131b2e; border: 1px solid #1f293d; border-radius: 12px; padding: 12px; display: flex; gap: 12px; align-items: center; }
    .card img { width: 85px; height: 85px; border-radius: 8px; object-fit: cover; background: #1a2332; }
    .card-info { flex: 1; min-width: 0; }
    .card-title { font-size: 1rem; font-weight: 700; color: #f9fafb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-author { font-size: 0.75rem; color: #9ca3af; margin-top: 2px; }
    .card-desc { font-size: 0.8rem; color: #6b7280; margin: 4px 0 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    
    .tags { display: flex; gap: 6px; margin-bottom: 8px; }
    .tag { background: #064e3b; color: #34d399; font-size: 0.65rem; font-weight: bold; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }

    .btn-download { display: inline-flex; align-items: center; gap: 6px; background: #10b981; color: #000; font-weight: bold; font-size: 0.85rem; padding: 6px 14px; border-radius: 8px; text-decoration: none; }
    .btn-download:hover { background: #059669; }
  </style>
</head>
<body>

  <header>
    <div class="logo">SP Addons <span>BEDROCK</span></div>
  </header>

  <div class="categories">
    <button class="cat-btn active">Add-ons Bedrock</button>
    <button class="cat-btn">Texturas</button>
    <button class="cat-btn">Mapas</button>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Buscar Add-ons, Texturas e Conteúdos Bedrock..." onkeyup="filterAddons()">
  </div>

  <div class="counter" id="addonCount">Carregando conteúdos...</div>

  <div class="addons-list" id="addons-container"></div>

  <script>
    const SUPABASE_URL = 'https://dsezdcusbhitmzjipvgy.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Kodxv-JTmas50sItp-s3Gg_R8GMX5l_';
    let allAddons = [];

    async function fetchAddons() {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/addons?select=*`, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });
        allAddons = await response.json();
        renderAddons(allAddons);
      } catch (err) {
        document.getElementById('addonCount').innerText = "Erro ao carregar addons.";
      }
    }

    function renderAddons(addons) {
      const container = document.getElementById('addons-container');
      const countEl = document.getElementById('addonCount');
      container.innerHTML = '';
      countEl.innerText = `${addons.length} resultados encontrados`;

      if (addons.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#6b7280; padding:20px;">Nenhum addon Bedrock encontrado.</p>';
        return;
      }

      addons.forEach(addon => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${addon.image_url || 'https://via.placeholder.com/100'}" alt="${addon.title}">
          <div class="card-info">
            <div class="card-title">${addon.title}</div>
            <div class="card-author">por ${addon.author || 'Comunidade'}</div>
            <div class="card-desc">${addon.description || 'Sem descrição.'}</div>
            <div class="tags">
              <span class="tag">BEDROCK</span>
              <span class="tag">${addon.category || 'Addon'}</span>
            </div>
            <a href="${addon.download_url}" class="btn-download">↓ Baixar</a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterAddons() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allAddons.filter(a => a.title.toLowerCase().includes(query) || a.description.toLowerCase().includes(query));
      renderAddons(filtered);
    }

    fetchAddons();
  </script>
</body>
</html>
